version: "3"

# Local settings for the run tasks (never committed: .env is in .gitignore). See .env.example.
dotenv: ['.env']

vars:
  PROJECT_NAME: quisora
  # development only: the master key the dev tasks pass (DEV_MASTER_KEY in .env overrides it); never use it for real data
  DEV_MASTER_KEY: '{{.DEV_MASTER_KEY | default "sZ3MBZVe5iTdiVcu+MynBZ+sno66576XaxBkMyqMkuQ="}}'
  PLATFORMS:
    - linux/amd64
    - linux/arm64
    - darwin/amd64
    - darwin/arm64
    - windows/amd64
    - windows/arm64
  # the version is kept in internal/build/version.go (raised for a release); the build stamps the commit and the date
  VERSION:
    sh: go run ./scripts/getversion
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || true
  BUILT_AT:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  BUILD_FLAGS: '-ldflags="-s -w -X github.com/paularlott/quisora/internal/build.Commit={{.COMMIT}} -X github.com/paularlott/quisora/internal/build.Date={{.BUILT_AT}}" -trimpath'
  OUTPUT_DIR: bin

tasks:
  default:
    desc: Build the binary for all platforms
    deps: [all]

  webassets:
    desc: Build the CSS, JavaScript and the API reference (/api-docs/) into web/dist with Vite (embedded in the binary)
    dir: web
    cmds:
      # no dependency install scripts (as in the Dockerfile): nothing a package ships runs on this machine
      - npm ci --silent --ignore-scripts
      - npm run build --silent
    sources:
      - src/**/*
      - templates/**/*
      - api-docs/**/*
      - openapi/**/*
      - vite.config.js
      - redocly.yaml
      - package.json
      - package-lock.json
    generates:
      - dist/manifest.json

  webassets-watch:
    desc: Rebuild web/dist whenever the sources change (run the server from another terminal)
    dir: web
    cmds:
      - npm run watch

  apidocs-lint:
    desc: Lint the OpenAPI description (web/openapi/openapi.yaml) with Redocly CLI
    dir: web
    cmds:
      - npm run lint:api --silent

  build:
    desc: Build the binary for the current platform
    deps: [webassets]
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}{{exeExt}} .

  build-1password:
    desc: "Build the binary for the current platform with 1Password service accounts (the onepassword tag: the 1Password SDK, about 15 MB, which calls 1Password's servers)"
    deps: [webassets]
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -tags onepassword {{.BUILD_FLAGS}} -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}-1password{{exeExt}} .

  tag:
    desc: Tag the current commit v<version> (internal/build/version.go) and push the tag
    preconditions:
      - sh: test -z "$(git status --porcelain)"
        msg: "the working tree has uncommitted changes: commit them first, so the tag names the code that is built"
    cmds:
      - git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
      - git push origin v{{.VERSION}}
    status:
      - git rev-parse -q --verify "refs/tags/v{{.VERSION}}" >/dev/null # tagged already

  release:
    desc: "Release the version in internal/build/version.go: tag it (task tag, skipped when the tag exists), build every platform (task all), and create the GitHub release v<version> with the binaries and their SHA-256 checksums (needs gh)"
    preconditions:
      - sh: test -z "$(git status --porcelain)"
        msg: "the working tree has uncommitted changes: commit them first, so the release is the tagged code"
      - sh: '! git rev-parse -q --verify "refs/tags/v{{.VERSION}}" >/dev/null || test "$(git rev-list -n 1 v{{.VERSION}})" = "$(git rev-parse HEAD)"'
        msg: "v{{.VERSION}} already tags another commit: raise Version in internal/build/version.go"
    cmds:
      - task: tag
      - task: all
      - cd {{.OUTPUT_DIR}} && rm -f SHA256SUMS && shasum -a 256 {{.PROJECT_NAME}}-* > SHA256SUMS
      - gh release create v{{.VERSION}} {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}-* {{.OUTPUT_DIR}}/SHA256SUMS -t "Quisora {{.VERSION}}" --generate-notes

  conformance-tools:
    desc: Build the OpenID conformance harness tools (bin/seed, bin/fakeidp); see conformance/README.md
    cmds:
      - go build -o {{.OUTPUT_DIR}}/seed ./conformance/seed
      - go build -o {{.OUTPUT_DIR}}/fakeidp ./conformance/fakeidp

  loadtest:
    desc: Build the load test tool (bin/loadtest); development only, not part of the quisora binary
    cmds:
      - go build -o {{.OUTPUT_DIR}}/loadtest{{exeExt}} ./tools/loadtest

  all:
    desc: Build the binary for every platform, with and without 1Password service accounts (quisora-1password-…)
    deps: [webassets]
    cmds:
      - for: { var: PLATFORMS }
        cmd: >-
          CGO_ENABLED=0 GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}}
          go build {{.BUILD_FLAGS}}
          -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}-{{splitList "/" .ITEM | first}}-{{splitList "/" .ITEM | last}}{{if eq (splitList "/" .ITEM | first) "windows"}}.exe{{end}} .
      - for: { var: PLATFORMS }
        cmd: >-
          CGO_ENABLED=0 GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}}
          go build -tags onepassword {{.BUILD_FLAGS}}
          -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}-1password-{{splitList "/" .ITEM | first}}-{{splitList "/" .ITEM | last}}{{if eq (splitList "/" .ITEM | first) "windows"}}.exe{{end}} .

  run:
    desc: Run a local server (BadgerDB, self-signed certificate) on https://localhost:8443
    deps: [build]
    cmds:
      - '{{.OUTPUT_DIR}}/{{.PROJECT_NAME}} bootstrap --data-dir ./data/dev --master-key "{{.DEV_MASTER_KEY}}"'
      - '{{.OUTPUT_DIR}}/{{.PROJECT_NAME}} serve --data-dir ./data/dev --master-key "{{.DEV_MASTER_KEY}}"'

  run-server:
    desc: "Run a standalone instance on https://localhost:8443, or DEV_PUBLIC_URL / DEV_LISTEN from .env (self-signed certificate in data/dev/tls), with a bootstrap admin (the first run prints the invitation link); mail goes to the Mailpit test server at localhost:1025, or DEV_SMTP_HOST from .env. Uses the full build, with 1Password service accounts (bin/quisora-1password)"
    deps: [build-1password]
    vars:
      PUBLIC_URL: '{{.DEV_PUBLIC_URL | default "https://localhost:8443"}}'
      LISTEN: '{{.DEV_LISTEN | default "localhost:8443"}}'
      SMTP_HOST: '{{.DEV_SMTP_HOST | default "localhost"}}'
    cmds:
      - mkdir -p ./data/dev
      - >-
        {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}-1password{{exeExt}} bootstrap
        --master-key "{{.DEV_MASTER_KEY}}"
        --data-dir ./data/dev
        --public-url {{.PUBLIC_URL | default "https://localhost:8443"}}
        --bootstrap-admin admin@example.com
      - >-
        {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}-1password{{exeExt}} serve
        --master-key "{{.DEV_MASTER_KEY}}"
        --listen {{.LISTEN | default "127.0.0.1:8443"}}
        --public-url {{.PUBLIC_URL | default "https://localhost:8443"}}
        --data-dir ./data/dev
        --smtp-host {{.SMTP_HOST | default "localhost"}}
        --smtp-port 1025
        --smtp-tls none
        --smtp-from "Quisora <quisora@example.com>"
        --password-min-length 10
        --allow-private-networks
        --log-level debug

  run-server-db:
    desc: "Like run-server, but stores its data in the remote database server named by DEV_DB_HOST, DEV_DB_USER, DEV_DB_PASSWORD, DEV_DB_NAME (and DEV_DB_BACKEND, mysql or mariadb, default mysql) in .env. Run a standalone instance on https://localhost:8443, or DEV_PUBLIC_URL / DEV_LISTEN from .env (self-signed certificate in data/dev/tls), with a bootstrap admin (the first run prints the invitation link); mail goes to the Mailpit test server at localhost:1025, or DEV_SMTP_HOST from .env. Uses the full build, with 1Password service accounts (bin/quisora-1password)"
    deps: [build-1password]
    vars:
      DB_BACKEND: '{{.DEV_DB_BACKEND | default "mysql"}}'
      PUBLIC_URL: '{{.DEV_PUBLIC_URL | default "https://localhost:8443"}}'
      LISTEN: '{{.DEV_LISTEN | default "localhost:8443"}}'
      SMTP_HOST: '{{.DEV_SMTP_HOST | default "localhost"}}'
    env:
      QUISORA_STORAGE: '{{.DB_BACKEND}}'
      QUISORA_MYSQL_DSN: '{{.DEV_DB_USER}}:{{.DEV_DB_PASSWORD}}@tcp({{.DEV_DB_HOST}}:{{.DEV_DB_PORT | default "3306"}})/{{.DEV_DB_NAME}}?parseTime=true'
      QUISORA_MARIADB_DSN: '{{.DEV_DB_USER}}:{{.DEV_DB_PASSWORD}}@tcp({{.DEV_DB_HOST}}:{{.DEV_DB_PORT | default "3306"}})/{{.DEV_DB_NAME}}?parseTime=true'
    cmds:
      - mkdir -p ./data/db
      - >-
        {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}-1password{{exeExt}} bootstrap
        --master-key "{{.DEV_MASTER_KEY}}"
        --data-dir ./data/dev
        --public-url {{.PUBLIC_URL | default "https://localhost:8443"}}
        --bootstrap-admin admin@example.com
      - >-
        {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}-1password{{exeExt}} serve
        --master-key "{{.DEV_MASTER_KEY}}"
        --listen {{.LISTEN | default "127.0.0.1:8443"}}
        --public-url {{.PUBLIC_URL | default "https://localhost:8443"}}
        --data-dir ./data/db
        --smtp-host {{.SMTP_HOST | default "localhost"}}
        --smtp-port 1025
        --smtp-tls none
        --smtp-from "Quisora <quisora@example.com>"
        --password-min-length 10
        --allow-private-networks
        --log-level debug
        --skin matte

  test:
    desc: "The everyday loop: vet, and every Go test with the race detector but the cluster package's (task test-cluster): the store drivers' conformance suite and every layer above them (set the QUISORA_TEST_* variables for database servers)"
    cmds:
      - go vet ./...
      - go test -race $(go list ./... | grep -v /internal/cluster)

  test-ssh-e2e:
    desc: Runs the SSH end-to-end test against a real sshd in Docker (an Ubuntu 24.04 container that trusts a tenant's user and host CA; needs Docker and OpenSSH's ssh and ssh-keygen, about a minute)
    cmds:
      - QUISORA_SSH_E2E=1 go test -race -count=1 -timeout 15m -run E2E -v ./internal/sshe2e/

  test-cluster:
    desc: "The cluster package with the race detector (one test after another, the slow part), the store conformance suite against cluster.Store (every store keeps the same promises), and the tests that use fault hooks and counters (-tags faults, not built into a release)"
    cmds:
      - go vet -tags faults ./...
      - QUISORA_CONFORMANCE=1 go test -race -timeout 60m ./internal/cluster/
      # only the tests of the files built with the tag (//go:build faults): name a new one here
      - QUISORA_CONFORMANCE=1 go test -race -timeout 60m -tags faults -run 'TestConformanceLostReplies|TestOverwrittenWriteWithALostReplyIsUnknownNotStale|TestReplayedUnconditionalWriteKeepsTheSuccessor|TestPartitionSyncMode|TestImportTooBigForOneTransaction|TestBusyPartitionStateWritesNeverConflict|TestConcurrentPartitionCommitsOnSharedCountersSucceed' ./internal/cluster/ ./internal/store/kvstore/ ./internal/store/sqlstore/

  cover:
    desc: Statement coverage of the production code across packages; fails below the floor in scripts/coverage-floor
    cmds:
      - scripts/cover.sh

  chaos:
    desc: "The cluster chaos soak, strict (any invariant broken fails it), a minute on each node-local backend: random node kills, cut links, failed and cut catch-ups, unknown write outcomes (internal/cluster/chaos_test.go; QUISORA_CHAOS_SEED replays a run)"
    cmds:
      - QUISORA_CHAOS=1 QUISORA_CHAOS_STRICT=1 QUISORA_CHAOS_BACKEND=badger go test -count=1 -timeout 15m -run TestChaosSoak ./internal/cluster/
      - QUISORA_CHAOS=1 QUISORA_CHAOS_STRICT=1 QUISORA_CHAOS_BACKEND=sqlite go test -count=1 -timeout 15m -run TestChaosSoak ./internal/cluster/

  check:
    desc: "Release gate: vet and every Go test with the race detector, the cluster chaos soak, production coverage at or above its floor, the OpenAPI lint, known vulnerabilities in the Go code and modules (govulncheck) and in the web dependencies (npm audit, high and above, less the accepted ones in web/audit.mjs)"
    cmds:
      - task: test
      - task: test-cluster
      - go vet -tags onepassword ./...      # the build with 1Password service accounts compiles too
      - go test -tags onepassword ./internal/secrets/
      - task: chaos
      - task: cover
      - task: apidocs-lint
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - cd web && node audit.mjs  # npm audit, high and above, with the accepted advisories it lists

  upgrade:
    desc: Upgrade the Go modules and the web dependencies (npm, within the ranges in web/package.json), then audit both
    cmds:
      - go get -u ./...
      - go mod tidy
      - cd web && npm update --ignore-scripts
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - cd web && node audit.mjs

  test-dbs:
    desc: Start the PostgreSQL, MySQL and MariaDB test containers
    cmds:
      - scripts/test-dbs.sh up

  test-all:
    desc: Run every Go test against every storage backend
    deps: [test-dbs]
    cmds:
      - eval "$(scripts/test-dbs.sh env)" && go test -race $(go list ./... | grep -v /internal/cluster)
      - task: test-cluster

  test-ui:
    desc: Accessibility (axe, WCAG 2.2 AA) and keyboard tests in Chromium
    dir: web
    cmds:
      - npx playwright test

  bench:
    desc: Run the Go benchmarks
    cmds:
      - go test -run '^$' -bench . -benchmem ./...
