              display_name:
                type: string
        has_password:
          type: boolean
          description: whether a password is set; the password itself is never returned
        last_login:
          type: string
          format: date-time
        linked_emails:
          type: array
          description: further addresses of the user; they let upstream providers find the user and never sign in by themselves
          items: {$ref: "#/components/schemas/LinkedEmail"}
        locale:
          type: string
          description: BCP 47 language tag such as en-GB (the locale claim); en_GB is accepted and stored as en-GB
        manager:
          type: object
          description: the manager's name; present on GET of one user
          properties:
