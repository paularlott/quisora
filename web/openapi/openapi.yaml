openapi: 3.1.0
info:
  title: Quisora management API
  version: "2026-10-20"
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  description: |-
    Everything an administrator can do. The path prefix /api never changes; select the API version with the Api-Version header. Versions are dates (YYYY-MM-DD): the release that introduced them; a new one comes only with a change that would break existing callers. The current version is 2026-10-20. Without the header the oldest supported version is served.

    With a browser session, managers and above must have signed in with a second factor; otherwise every call answers 403 with field "mfa".

    Automation: a service account is a non-human principal of one organization that gets an access token from the organization's token endpoint (/o/{org}/oauth/token, client credentials) and calls this API with it as a bearer token. It holds only the scopes it was granted, and each operation below names the one it needs in its security requirements (the serviceAccount scheme; no such requirement: service accounts cannot call it). See the Service accounts tag and the serviceAccount security scheme.

    Failed bearer authentications (this API and SCIM together) are limited to 60 per address and minute: past that every bearer request from the address answers 429 with Retry-After for the rest of the minute, before its token is checked. Successful requests never count.

    SCIM 2.0 (RFC 7643, RFC 7644) is described too, under the SCIM tag: a provisioning client's base URL is /scim/v2/{org}. It answers application/scim+json and takes a personal API token with the scim scope, or the access token of a service account that holds the scim scope.

    Not described here: the OAuth 2 / OpenID Connect endpoints (see /.well-known/openid-configuration), the account page's own API under /o/{org}/api-internal/account (the signed-in user of that organization, session only) and the live-update stream at /api/events (server-sent events: a browser session, or a token with the admin scope).
servers:
  - url: /
    description: this server
security:
  - session: []
  - bearer: [admin]
tags:
  - name: Organizations
    description: Organizations hold users, groups, tenants, clients and sign-in providers. Creating, renaming and deleting them is for super admins; on the primary organization a service account with the orgs:create scope creates them, and one with orgs:delete deletes the ones it created.
  - name: Users
    description: People who sign in, with their email addresses, invitations, sessions, linked providers, passkeys and personal API tokens.
  - name: Groups
    description: Groups of users. Their tags reach applications in the tags claim, and tenant access can be given to a whole group.
  - name: Tenants
    description: Groups of applications that share sign-in rules and resources.
  - name: Tenant access
    description: Which users and groups may use a tenant's applications, with their roles, tags and end dates.
  - name: SSH certificates
    description: "A tenant's SSH certificate authority: its settings, CA keys, issued certificates, and signing host certificates. Servers trust the tenant's CA keys (TrustedUserCAKeys); the public endpoints under /o/{org}/ssh/{tenant} serve them, and `quisora ssh` is the client."
  - name: Clients
    description: "OAuth 2 / OpenID Connect clients: the applications that sign users in through this server."
  - name: Providers
    description: Upstream sign-in providers (other OpenID Connect or OAuth 2 identity providers) users can sign in with.
  - name: Service accounts
    description: Non-human principals of an organization that call this API and SCIM with client-credentials access tokens, each holding only the scopes it was granted. Their administrators are org admins and super admins (and service accounts with the service_accounts scope).
  - name: Audit
    description: The audit log, per organization and across all of them.
  - name: Keys
    description: Token signing keys and the master key that seals stored secrets (super admins).
  - name: Backup
    description: A backup of the whole store (super admins).
  - name: System
    description: The server as a whole (super admins).
  - name: Cluster
    description: The state of a server cluster (super admins).
  - name: Emergency sign-out
    description: Break glass. End every session of an organization, or of the whole server, at once.
  - name: SCIM
    description: SCIM 2.0 provisioning (RFC 7643, RFC 7644). Bodies are application/scim+json; the base URL for an organization is /scim/v2/{org}.
paths:
  /api/orgs:
    parameters:
      - {$ref: "#/components/parameters/ApiVersion"}
    get:
      tags: [Organizations]
      summary: List organizations (non-super callers see only their own)
      operationId: get_orgs
      security:
        - session: []
        - bearer: [admin]
      parameters:
        - {$ref: "#/components/parameters/Q"}
        - name: sort
          in: query
          description: sort field
          schema:
            type: string
            enum: [name, display_name, created]
        - {$ref: "#/components/parameters/Desc"}
        - {$ref: "#/components/parameters/Offset"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrgList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      tags: [Organizations]
      summary: Create an organization (super admin, or a service account with orgs:create)
      description: "Create an organization (super admin, or a service account of the primary organization with the orgs:create scope). The optional service_account is the organization's first service account, with any of the service account scopes, import included (orgs:create and orgs:delete are only for the primary organization's own accounts). The response carries its secret, shown once (none for private_key_jwt). If the account cannot be created the organization is not left behind. A service account that creates an organization is the only one that may delete it again."
      operationId: post_orgs
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [orgs:create]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrgInput"}
        required: true
      responses:
        "201":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrgCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - {$ref: "#/components/parameters/ApiVersion"}
    get:
      tags: [Organizations]
      summary: Get an organization
      operationId: get_orgs_org
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: []
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Org"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
    patch:
      tags: [Organizations]
      summary: Rename an organization or change its sign-in and session settings
      description: Rename an organization or change its sign-in and session settings (super admin). Settings left out
        of `settings` keep their current values.
      operationId: patch_orgs_org
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrgInput"}
        required: true
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Org"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      tags: [Organizations]
      summary: Delete an organization
      description: Delete an organization (super admin, or a service account with the orgs:delete scope, which may delete only organizations it created). ?cascade=1 also deletes its users, groups, clients and providers; they stop working at once, and their records are removed in the background within about a day. 409 while SSH certificates are on for one of its tenants (turn SSH off there first)
      operationId: delete_orgs_org
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [orgs:delete]
      parameters:
        - name: cascade
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/branding:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - {$ref: "#/components/parameters/ApiVersion"}
    patch:
      tags: [Organizations]
      summary: Change an organization's logo and colour
      description: "Change the logo and primary colour the organization's sign-in pages and console show (the organization's administrators and super admins; not service accounts: updates need a human). A field left out keeps its value; an empty string removes it. A logo is a data: URI of a PNG, JPEG, WebP or SVG image, at most 256 KB decoded, whose content must be the type the URI names. A dark logo needs a light one, and removing the light logo removes the dark one too. The colour is #rrggbb and dark enough for white text on it at a contrast of 4.5:1 (WCAG 2.2 AA). Quisora serves the logos and a stylesheet for the colour itself (/o/{org}/branding/); without a logo or colour the pages show the server's. Returns the organization. Audited as org.branding."
      operationId: patch_orgs_org_branding
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrandingInput"}
        required: true
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Org"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/sign-out:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - {$ref: "#/components/parameters/ApiVersion"}
    post:
      tags: [Emergency sign-out]
      summary: Sign everyone in the organization out
      description: |-
        Ends every browser session and refresh grant of the organization at once, on every node, and so every access token issued from them; with `api_tokens`, its personal API tokens too. The session making the request is kept. Organization administrators and super admins, from a browser session that re-authenticated in the last 5 minutes (otherwise 403 with field `reauth`; an API token is refused). Applications are then told (back-channel logout) and the ended records deleted, in the background. Applications that check access tokens themselves rather than through introspection accept the ones already issued until they expire. Tokens of applications acting for themselves (client credentials) are not affected: rotate the client's secret.
      operationId: post_orgs_org_sign_out
      security:
        - session: []
        - bearer: [admin]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignOutRequest"}
        required: true
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignOutEvent"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/users:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - {$ref: "#/components/parameters/ApiVersion"}
    get:
      tags: [Users]
      summary: List users
      description: List users; ?tag=<tag> keeps only users carrying exactly that tag; q also matches tags
      operationId: get_orgs_org_users
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [users]
      parameters:
        - {$ref: "#/components/parameters/Q"}
        - name: sort
          in: query
          description: sort field
          schema:
            type: string
            enum: [username, email, name, role, active, created]
        - {$ref: "#/components/parameters/Desc"}
        - {$ref: "#/components/parameters/Offset"}
        - {$ref: "#/components/parameters/Limit"}
        - name: role
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: string
        - name: tag
          in: query
          description: only the users with this tag (the whole tag, ignoring case)
          schema:
            type: string
        - name: external_id
          in: query
          description: the one user with this external id, or none (an indexed lookup; the other parameters are ignored)
          schema:
            type: string
        - name: email
          in: query
          description: the one user whose primary or linked address this is (ignoring case), or none (an indexed lookup; the other parameters are ignored)
          schema:
            type: string
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      tags: [Users]
      summary: Create a user without a password
      description: "Create a user without a password; optionally issue (and email) an invitation link. A super admin's token with
        the import scope can also bring a user's password hash, authenticator secret and provider links from another system
        (password_hash, totp_secret, identities). Do not issue an invitation to such a user: accepting one replaces every way
        they sign in."
      operationId: post_orgs_org_users
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [users]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserCreate"}
        required: true
      responses:
        "201":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserCreated"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/users/{id}:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
      - {$ref: "#/components/parameters/ApiVersion"}
    get:
      tags: [Users]
      summary: Get a user with their groups
      operationId: get_orgs_org_users_id
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [users]
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
    patch:
      tags: [Users]
      summary: Update a user (role, active, profile)
      operationId: patch_orgs_org_users_id
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [users]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserInput"}
        required: true
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      tags: [Users]
      summary: Delete a user and everything that belongs to them
      operationId: delete_orgs_org_users_id
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [users]
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ok"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/users/{id}/password:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
      - {$ref: "#/components/parameters/ApiVersion"}
    delete:
      tags: [Users]
      summary: Remove the user's password and end their sessions
      description: Remove the user's password and end their sessions; they can sign in with a password again only after
        accepting a new invitation
      operationId: delete_orgs_org_users_id_password
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [users]
      responses:
        "204":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/users/{id}/totp:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
      - {$ref: "#/components/parameters/ApiVersion"}
    delete:
      tags: [Users]
      summary: Remove the user's authenticator app
      description: Remove the user's authenticator app (a lost or replaced phone), and their recovery codes when it was
        their last second factor. They keep their password and set up a second factor again on their account page, or
        at their next sign-in where one is required. Needs a recent re-authentication; a manager's or administrator's
        only a super admin may remove
      operationId: delete_orgs_org_users_id_totp
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [users]
      responses:
        "204":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/users/{id}/lock-out:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
      - {$ref: "#/components/parameters/ApiVersion"}
    post:
      tags: [Users]
      summary: Disable the user and remove every way they had to sign in
      description: |-
        For a compromised account or a leaver. The user is disabled (with the reason, as when disabling them), their sessions and refresh grants end at once (applications are told, and remembered consent goes with the grants), and their password, authenticator app, passkeys, linked sign-in providers, personal API tokens and unused invitation, reset and verification links are removed. The account stays, for the audit log. Enabling it again brings none of that back: it then needs a new invitation. The rules are those of removing someone's password and of disabling them (never your own account; an established administrator's only by a super admin), from a browser session that re-authenticated in the last 5 minutes (otherwise 403 with field `reauth`; an API token is refused). Audited as user.locked_out.
      operationId: post_orgs_org_users_id_lock_out
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [users]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: shown on the user's page and kept in the audit log (optional)
        required: true
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/users/{id}/invite:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
      - {$ref: "#/components/parameters/ApiVersion"}
    post:
      tags: [Users]
      summary: Issue a new single-use invitation link
      description: Issue a new single-use invitation link (valid 7 days; earlier links stop working) through which the user
        sets a password, if their organization allows passwords, or creates a passkey; optionally email it
      operationId: post_orgs_org_users_id_invite
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [users]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InviteRequest"}
        required: true
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invite"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/users/{id}/emails:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - name: id
        in: path
        required: true
        description: id
        schema:
          type: string
      - {$ref: "#/components/parameters/ApiVersion"}
    post:
      tags: [Users]
      summary: Link another email address to the user
      description: "Link another email address to the user (managers and up, for users they manage and themselves; for
