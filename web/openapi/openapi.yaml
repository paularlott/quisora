          type: string
        type:
          type: string
        via:
          type: string
          description: how it was linked
          enum: [email, provision, connect, admin]
    LinkedProviderList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/LinkedProvider"}
        total:
          type: integer
    MasterKey:
      type: object
      properties:
        active_key:
          type: string
        detail:
          type: string
        nodes:
          type: object
          description: the keys every live node reported, by node id
          additionalProperties:
            type: object
            properties:
              active_key:
                type: string
              previous_keys:
                type: array
                items:
                  type: string
              queued_items_stale:
                type: integer
                description: items of the node's queues still sealed with a previous key
              queued_items_lost:
                type: integer
                description: items of the node's queues sealed with a key that is not configured
        nodes_agree:
          type: boolean
          description: every live node seals with active_key
        previous_keys:
          type: array
          description: this node's server.previous_master_keys, by key id
          items:
            type: string
        previous_keys_removable:
          type: boolean
          description: the previous keys can be removed now
        queued_items_lost:
          type: integer
          description: queued messages (every node) sealed with a key that is not configured; a warning only, they are given up once 8 days old
        queued_items_stale:
          type: integer
          description: queued messages (every node) still sealed with a previous key; the previous keys stay until they are re-sealed
        stale_secrets:
          type: integer
          description: stored secrets sealed with a previous key (being re-sealed)
        state:
          type: string
          enum: [none, waiting_for_nodes, resealing, unopenable, complete]
        unopenable_secrets:
          type: integer
          description: stored secrets no configured key opens
    Member:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
          description: the user's full name
        role:
          type: string
        username:
          type: string
    MemberList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Member"}
