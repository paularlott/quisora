      description: |-
        Removes a key that no longer signs (state previous) at once, rather than when the tokens it signed expire: they stop verifying here now (userinfo, introspection), and applications stop accepting them once they fetch the key set again. For a key that may have been exposed: rotate first, then remove the old key (the key that signs now, or will, cannot be removed: 422). Applications get new tokens through their refresh tokens; nobody is signed out. Super admins, from a browser session that re-authenticated in the last 5 minutes. Audited as keys.remove.
