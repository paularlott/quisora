        "404": {$ref: "#/components/responses/ScimNotFound"}
        "409": {$ref: "#/components/responses/ScimConflict"}
components:
  parameters:
    ApiVersion:
      name: Api-Version
      in: header
      required: false
      description: "API version: the date (YYYY-MM-DD) of the release that introduced it; responses echo it. Without it the oldest supported version is served."
      schema:
        type: string
        enum: ["2026-10-20"]
    Org:
      name: org
      in: path
      required: true
      description: organization id or URL name
      schema:
        type: string
        pattern: ^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?|[0-9A-Za-z]{22})$
    Q:
      name: q
      in: query
      description: case-insensitive prefix search (a user's username, email, full name or family name; a group's or organization's name). A user search that finds nobody that way finds the users with exactly that tag.
      schema:
        type: string
    AuditFrom:
      name: from
      in: query
      description: events at or after this time (RFC 3339)
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: events before this time (RFC 3339)
      schema:
        type: string
        format: date-time
    AuditActionGroup:
      name: action_group
      in: query
      description: "a family of actions: the actions starting with this text, such as user. or login. (case-insensitive)"
      schema:
        type: string
    AuditAction:
      name: action
      in: query
      description: one action, such as user.update
      schema:
        type: string
    AuditOutcome:
      name: outcome
      in: query
      schema:
        type: string
        enum: [success, failure]
    Desc:
      name: desc
      in: query
      description: descending order (1)
      schema:
        type: boolean
    Offset:
      name: offset
      in: query
      description: items to skip
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      description: page size, default 25, max 100
      schema:
        type: integer
    ScimFilter:
      name: filter
      in: query
      description: SCIM filter, for example userName eq "alan"
      schema:
        type: string
    ScimSortBy:
      name: sortBy
      in: query
      description: attribute to sort by
      schema:
        type: string
    ScimSortOrder:
      name: sortOrder
      in: query
      description: ascending or descending
      schema:
        type: string
    ScimStartIndex:
      name: startIndex
      in: query
      description: 1-based index of the first result
      schema:
        type: integer
    ScimCount:
      name: count
      in: query
      description: page size
      schema:
        type: integer
    ScimAttributes:
      name: attributes
      in: query
      description: attributes to return, comma separated
      schema:
        type: string
    ScimExcludedAttributes:
      name: excludedAttributes
      in: query
      description: attributes to leave out
      schema:
        type: string
  headers:
    ApiVersion:
      description: the API version that answered
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
      description: Unsupported Api-Version or unreadable body
    Unauthorized:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
      description: Not signed in or invalid token
    Forbidden:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
      description: "Not permitted (or CSRF check failed, or the token lacks the admin scope; for a service account: it lacks the scope the operation needs, or the operation is closed to service accounts)"
    ForbiddenBackup:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
      description: Not permitted (or CSRF check failed, or the token lacks the backup scope)
    NotFound:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
      description: Not found
    Conflict:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
      description: Conflict
    ValidationFailed:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
      description: Validation failed; `field` names the input
    Unavailable:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
      description: This server cannot make the change now (catching up with its cluster, or cut off from its majority), or a
        majority has not confirmed it yet; Retry-After says when to try again
    ScimBadRequest:
      content:
        application/scim+json:
          schema: {$ref: "#/components/schemas/ScimError"}
      description: Invalid request (scimType says which)
    ScimUnauthorized:
      content:
        application/scim+json:
          schema: {$ref: "#/components/schemas/ScimError"}
      description: No token, or an invalid one
    ScimForbidden:
      content:
        application/scim+json:
          schema: {$ref: "#/components/schemas/ScimError"}
      description: Not permitted, or the token lacks the scim scope
    ScimNotFound:
      content:
        application/scim+json:
          schema: {$ref: "#/components/schemas/ScimError"}
      description: No such organization or resource
    ScimConflict:
      content:
        application/scim+json:
          schema: {$ref: "#/components/schemas/ScimError"}
      description: Conflict (uniqueness, or a stale ETag)
  securitySchemes:
    bearer:
      bearerFormat: qsr_<id>_<secret>
      description: "Personal API token with the admin scope (the backup download: the backup scope; SCIM: the scim scope; creating users with a password hash, an authenticator secret or provider links: the import scope too, super admins only). The
        owning user's role still limits every call. A service account's access token is sent the same way: see the serviceAccount scheme."
      scheme: bearer
      type: http
    serviceAccount:
      description: "A service account's access token (client credentials, from the token endpoint of its organization: /o/{org}/oauth/token, with its client_id and secret or a private_key_jwt assertion; the token endpoint is in the account's token_endpoint), sent as a bearer token to this API and to SCIM. The account acts as an administrator of its own organization, never as a super admin, and holds only the scopes it was granted. Each operation lists the scope it needs in its serviceAccount requirement: users (users and managers), manage_admins (with users: administrators too), groups, providers, tenants, clients (also the self-registered applications), access (tenants' access lists), ssh (tenants' SSH certificate authorities: settings, keys and certificates), ssh:host (signing host certificates only), import (with users: password hashes, authenticator secrets and provider links on user create), scim (SCIM), service_accounts (the organization's service accounts, granting none more than it holds), and on the primary organization orgs:create and orgs:delete (the organizations it created). An empty requirement (serviceAccount with no scope) means any service account may call it: reading its organization, its tenants and its applications. An operation without a serviceAccount requirement is closed to service accounts (the organization's settings, the audit log, emergency sign-out, the server's keys, backups and status, the list of all organizations). A scope taken from an account, or the account disabled or deleted, stops its tokens at once. Its actions are audited as service:<name>."
      flows:
        clientCredentials:
          scopes:
            users: Users and managers
            manage_admins: With users, the organization's administrators too (never super admins)
            groups: Groups and their members
            providers: Sign-in providers
            tenants: Tenants
            clients: Applications (OAuth clients) and the self-registered ones
            access: Tenants' access lists
            ssh: Tenants' SSH certificate authorities (settings, keys, certificates)
            "ssh:host": Sign SSH host certificates
            import: With users, password hashes, authenticator secrets and provider links on user create (granted by super admins)
            scim: SCIM provisioning
            service_accounts: The organization's service accounts
            orgs:create: Create organizations (primary organization only)
            orgs:delete: Delete the organizations it created (primary organization only)
          tokenUrl: /o/{org}/oauth/token
      type: oauth2
    session:
      description: Browser session. Unsafe methods must also send the X-CSRF-Token header (from the page's csrf-token meta tag).
      in: cookie
      name: __Host-quisora_session
      type: apiKey
  schemas:
    APIToken:
      type: object
      properties:
        id:
          type: string
        app_scopes:
          type: array
          description: "api tokens: the application scopes the token is narrowed to; empty: its owner's full access"
          items:
            type: string
        audience:
          type: array
          description: "api tokens: the client ids that may introspect the token; empty: any confidential client of the
            organization"
          items:
            type: string
        expires:
          type: string
          description: "absent: never"
          format: date-time
        last_used:
          type: string
          description: "absent: never used"
          format: date-time
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
    APITokenList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/APIToken"}
        total:
          type: integer
    Access:
      type: object
      properties:
        id:
          type: string
        all_clients:
          type: boolean
        authorization_details:
          type: array
          description: "authorization details (RFC 9396) for the access tokens of the applications this access covers that are
            registered for their types (authorization_details_types): JSON objects, each with a type, at most 16 and 8 KB;
            string values may hold {{sub}} (the user's id), {{org}} and {{tenant}}; an object with locations goes only into
            tokens whose audience holds one of them; absent: none; [] removes them"
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
            additionalProperties: true
        clients:
          type: array
          description: client ids, when all_clients is false
          items:
            type: string
        detail:
          type: string
          description: the user's email address
        expired:
          type: boolean
        expires:
          type: string
          description: "absent: no end"
          format: date-time
        name:
          type: string
          description: the user's full name or the group's name
        org_id:
          type: string
        roles:
          type: array
          description: application role names (same characters as tags); sent in the roles claim of tokens for the tenant's
            applications
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._:/-]{0,62}[A-Za-z0-9])?$
        subject_id:
          type: string
        subject_type:
          type: string
          enum: [user, group]
        tags:
          type: array
          description: "identifiers (letters, digits and . _ : / -, 1-64 characters, starting and ending with a letter or digit; a
            colon separates a namespace, e.g. dept:finance); stored sorted; sent to applications in the tags claim
            together with the tags of the user's groups"
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._:/-]{0,62}[A-Za-z0-9])?$
        tenant_id:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    AccessInput:
      type: object
      properties:
        all_clients:
          type: boolean
          description: default true
        authorization_details:
          type: array
          description: "authorization details (RFC 9396) for the access tokens of the applications this access covers that are
            registered for their types (authorization_details_types): JSON objects, each with a type, at most 16 and 8 KB;
            string values may hold {{sub}} (the user's id), {{org}} and {{tenant}}; an object with locations goes only into
            tokens whose audience holds one of them; absent: none; [] removes them"
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
            additionalProperties: true
        clients:
          type: array
          description: client ids of this tenant, when all_clients is false
          items:
            type: string
        expires:
          type: string
          description: "RFC 3339 time, or a date (YYYY-MM-DD: access ends at the start of that day, UTC); empty: no end; omitted
            on update: unchanged"
        roles:
          type: array
          description: application role names (same characters as tags); sent in the roles claim of tokens for the tenant's
            applications
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._:/-]{0,62}[A-Za-z0-9])?$
        subject_id:
          type: string
          description: user or group id; required on create
        subject_type:
          type: string
          description: required on create
          enum: [user, group]
        tags:
          type: array
          description: "identifiers (letters, digits and . _ : / -, 1-64 characters, starting and ending with a letter or digit; a
            colon separates a namespace, e.g. dept:finance); stored sorted; sent to applications in the tags claim
            together with the tags of the user's groups"
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._:/-]{0,62}[A-Za-z0-9])?$
    AccessList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Access"}
        total:
          type: integer
    Audit:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        actor:
          type: string
        actor_id:
          type: string
        detail:
          type: object
          additionalProperties:
            type: string
        ip:
          type: string
        org_id:
          type: string
        target:
          type: string
        target_id:
          type: string
          description: The id of the user the event targets, when its target is a user (target holds their username at the time).
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Audit"}
        total:
          type: integer
    Branding:
      type: object
      description: The logo and colour an organization's sign-in pages and console show. Without a logo or colour they show the server's
      properties:
        primary_color:
          type: string
          description: "#rrggbb, or empty for the server's colour"
        logo_light:
          type: string
          description: URL of the logo, served by Quisora; absent without one
          readOnly: true
        logo_dark:
          type: string
          description: URL of the logo for the dark theme; absent without one (the light logo is shown then)
          readOnly: true
    BrandingInput:
      type: object
      properties:
        logo_light:
          type: string
          description: "data: URI of a PNG, JPEG, WebP or SVG image, at most 256 KB decoded, whose content is the type the URI names; \"\" removes the logo (and the dark one)"
          example: data:image/png;base64,iVBORw0KGgo=
        logo_dark:
          type: string
          description: "the logo for the dark theme, as logo_light; needs a light logo; \"\" removes it"
        primary_color:
          type: string
          description: "#rrggbb with a contrast of at least 4.5:1 against white text; \"\" removes it"
          example: "#134e4a"
    Client:
      type: object
      properties:
        id:
          type: string
        backchannel_logout_uri:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        first_party:
          type: boolean
        remember_consent:
          type: boolean
          description: remember each user's consent past signing out, until their access is removed; off (the default), users are asked once each time they sign in. Confidential clients only; a first-party client never asks
        grant_types:
          type: array
          description: "authorization_code, refresh_token, client_credentials, urn:ietf:params:oauth:grant-type:token-exchange
            (RFC 8693) and urn:ietf:params:oauth:grant-type:device_code (RFC 8628); client_credentials and token exchange
            not for public clients, the device grant not for FAPI 2.0 clients"
          items:
            type: string
        id_token_signed_response_alg:
          type: string
        accepts_api_tokens:
          type: boolean
          description: the application sees its users' personal API tokens (the api scope) through introspection, and they can be made for it; off by default, and never for a public client
