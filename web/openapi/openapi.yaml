        in: path
        required: true
        description: tenant id or name
        schema:
          type: string
      - {$ref: "#/components/parameters/ApiVersion"}
    get:
      tags: [SSH certificates]
      summary: List the tenant's SSH certificates
      description: "The certificates issued until they expire (they are kept an hour past their end), newest first, a page at a time as the users are listed (offset and limit; 25 by default, at most 100), each with whether it is active, expired or revoked and why. total counts every certificate that matches, not only those in the page. q searches, by the start of the text and ignoring case: the username or name of the user (as it is now), a principal (the whole of it, such as paul, group:ops or web1.example.com), the fingerprint of the certified key (SHA256:...), the serial and the key id (which starts with the username the certificate was issued to). There is no sort order: certificates are always newest first."
      operationId: get_orgs_org_tenants_id_ssh_certificates
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [ssh]
