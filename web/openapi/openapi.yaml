        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/cluster:
    parameters:
      - {$ref: "#/components/parameters/ApiVersion"}
    get:
      tags: [Cluster]
      summary: This node's cluster status
      description: "This node's cluster status (super admin): size, quorum, every node with its address, state and role,
        readiness, the partitions it owns (with each one's owner, epoch and committed position), and the counts of writes whose
        outcome is not known, refused writes and clock skew"
      operationId: get_cluster
