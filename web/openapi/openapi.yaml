        - {$ref: "#/components/parameters/Q"}
        - {$ref: "#/components/parameters/Offset"}
        - {$ref: "#/components/parameters/Limit"}
        - name: user
          in: query
          description: only this user's certificates (user id)
          schema:
            type: string
        - name: status
          in: query
          description: only certificates in this state (default all)
          schema:
            type: string
            enum: [active, revoked, expired, all]
        - name: host
          in: query
          description: only host certificates (true) or only user certificates (false)
          schema:
            type: boolean
      responses:
        "200":
          description: Success
