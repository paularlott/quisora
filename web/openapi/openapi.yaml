    parameters:
      - {$ref: "#/components/parameters/ApiVersion"}
    get:
      tags: [Backup]
      summary: Download a backup of the whole store
      description: "Download a backup of the whole store (super admin, with an API token: the backup scope): every record,
        secrets still sealed with the master key. It is encrypted (AES-256-GCM, the key derived from the
        X-Backup-Password header by argon2id; application/octet-stream) unless ?plain=1 asks for it unencrypted (a gzip
        stream); one or the other is required (400 otherwise). \"quisora backup --server\" downloads it with ?plain=1
        over TLS and encrypts it on the operator's machine, so the password never reaches the server. A point-in-time
        snapshot where the backend has one; taken while the server runs; one at a time per server (409 otherwise).
        Restore it with \"quisora restore\" or \"quisora serve --restore-from\""
      operationId: get_backup
      security:
        - session: []
        - bearer: [backup]
      parameters:
        - name: plain
          in: query
          description: "1: download the backup unencrypted (required unless X-Backup-Password is given)"
          schema:
            type: string
        - name: X-Backup-Password
          in: header
          description: password to encrypt the backup with, at least 12 characters (required unless ?plain=1)
          schema:
            type: string
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/gzip:
              schema:
                format: binary
                type: string
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/ForbiddenBackup"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
