              path:
                type: string
              value: {}
        schemas:
          type: array
          items:
            type: string
    ScimUser:
      type: object
      description: "A SCIM User (RFC 7643 §4.1) with Quisora's extension. Every attribute: the server's Schemas endpoint,
        urn:ietf:params:scim:schemas:core:2.0:User."
      properties:
        id:
          type: string
        active:
          type: boolean
        displayName:
          type: string
        emails:
          type: array
          items:
            type: object
            properties:
              primary:
                type: boolean
              type:
                type: string
              value:
                type: string
        externalId:
          type: string
        groups:
          type: array
          items:
            type: object
        meta:
          type: object
        name:
          type: object
          properties:
            familyName:
              type: string
            givenName:
              type: string
        schemas:
          type: array
          items:
            type: string
        userName:
          type: string
      additionalProperties: true
    SecretResult:
      type: object
      properties:
        client_id:
          type: string
        secret:
          type: string
    SelfRegisteredApp:
      type: object
      properties:
        client_id:
          type: string
        last_used:
          type: string
          format: date-time
        metadata_document:
          type: boolean
          description: client_id is the URL of its Client ID Metadata Document
        name:
          type: string
          description: the name the application gave itself
        redirect_uris:
          type: array
          items:
            type: string
        users:
          type: integer
          description: users of the organization it holds access for
        created:
          type: string
          format: date-time
    SelfRegisteredAppList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SelfRegisteredApp"}
        total:
          type: integer
    ServiceAccount:
      type: object
      properties:
        id:
          type: string
          description: the client_id the account authenticates with at its token endpoint
        description:
          type: string
        fapi2_security_profile:
          type: boolean
          description: "FAPI 2.0 Security Profile: needs private_key_jwt; its tokens are DPoP-bound and are presented with the DPoP scheme (SCIM takes them, the management API does not)"
        jwks:
          type: string
          description: "private_key_jwt: the account's public keys as a JWK Set (JSON); alternatively jwks_uri"
        jwks_uri:
          type: string
          description: "private_key_jwt: where the account publishes its public keys (https); alternatively jwks"
        name:
          type: string
          description: shown in the audit log as service:<name>
        scopes:
          type: array
          description: "what the account may do; see the serviceAccount security scheme. At least one. users, manage_admins, groups, providers, tenants, clients, access, ssh, ssh:host, import, scim and service_accounts are for any organization; orgs:create and orgs:delete for the primary organization alone"
          items:
            type: string
            enum: [users, manage_admins, groups, providers, tenants, clients, access, import, scim, service_accounts, ssh, "ssh:host", orgs:create, orgs:delete]
        token_endpoint_auth_method:
          type: string
          description: "how the account authenticates at the token endpoint: client_secret_post (default) or client_secret_basic with a secret Quisora issues, or private_key_jwt with keys it holds"
          enum: [client_secret_post, client_secret_basic, private_key_jwt]
        enabled:
          type: boolean
        token_endpoint:
          type: string
          description: where the account gets its access tokens (client credentials)
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    ServiceAccountCreated:
      description: A new service account with its secret
      allOf:
        - {$ref: "#/components/schemas/ServiceAccount"}
        - type: object
          properties:
            secret:
              type: string
              description: shown once; absent with private_key_jwt
    ServiceAccountInput:
      type: object
      properties:
        description:
          type: string
        fapi2_security_profile:
          type: boolean
          description: "FAPI 2.0 Security Profile: needs private_key_jwt; its tokens are DPoP-bound and are presented with the DPoP scheme (SCIM takes them, the management API does not)"
        jwks:
          type: string
          description: "private_key_jwt: the account's public keys as a JWK Set (JSON); alternatively jwks_uri"
        jwks_uri:
          type: string
          description: "private_key_jwt: where the account publishes its public keys (https); alternatively jwks"
        name:
          type: string
          description: shown in the audit log as service:<name>
        scopes:
          type: array
          description: "what the account may do; see the serviceAccount security scheme. At least one. users, manage_admins, groups, providers, tenants, clients, access, ssh, ssh:host, import, scim and service_accounts are for any organization; orgs:create and orgs:delete for the primary organization alone"
          items:
            type: string
            enum: [users, manage_admins, groups, providers, tenants, clients, access, import, scim, service_accounts, ssh, "ssh:host", orgs:create, orgs:delete]
        token_endpoint_auth_method:
          type: string
          description: "how the account authenticates at the token endpoint: client_secret_post (default) or client_secret_basic with a secret Quisora issues, or private_key_jwt with keys it holds"
          enum: [client_secret_post, client_secret_basic, private_key_jwt]
        enabled:
          type: boolean
          description: a disabled account gets no tokens, and the ones it has stop working at once
    ServiceAccountList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ServiceAccount"}
        total:
          type: integer
    ServiceAccountSecret:
      type: object
      properties:
        id:
          type: string
        secret:
          type: string
          description: shown once
    Tenant:
      type: object
      properties:
        id:
          type: string
        clients:
          type: integer
          description: number of clients in the tenant
        description:
          type: string
        display_name:
          type: string
        name:
          type: string
          description: URL-safe, unique in the organization
        org_id:
          type: string
        resources:
          type: array
          description: "the APIs the tenant owns (resource indicators, RFC 8707: an API's URL), unique across the server; a
            self-registered application asking for one is governed by this tenant"
          items:
            type: string
        settings: {$ref: "#/components/schemas/TenantSettings"}
        ssh:
          description: the tenant's SSH certificate authority settings (see SSH certificates); absent until SSH has been enabled
          allOf:
            - {$ref: "#/components/schemas/SSHSettings"}
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    TenantInput:
      type: object
      properties:
        description:
          type: string
        display_name:
          type: string
        name:
          type: string
        resources:
          type: array
          description: "the APIs the tenant owns (resource indicators, RFC 8707: an API's URL), unique across the server; a
            self-registered application asking for one is governed by this tenant"
          items:
            type: string
        settings: {$ref: "#/components/schemas/TenantSettings"}
    TenantList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Tenant"}
        total:
          type: integer
    TenantSettings:
      type: object
      properties:
        all_providers:
          type: boolean
          description: allow every enabled provider of the organization, including future ones
        members_only:
          type: boolean
          description: only users and groups with access (see Tenant access) may sign in to the tenant's applications; otherwise
            everyone in the organization may
        passkey_login:
          type: boolean
        password_login:
          type: boolean
        password_reset:
          type: boolean
          description: offer "Forgot your password?" on the sign-in form for the tenant's applications (with password_login, and
            when the organization allows resets)
        providers:
          type: array
          description: provider ids allowed when all_providers is false
          items:
            type: string
        require_mfa:
          type: boolean
          description: in addition to the organization setting
        self_registration:
          type: boolean
          description: applications that registered themselves (RFC 7591, or a Client ID Metadata Document) may sign users in for
            the tenant's resources; off by default
    User:
      type: object
      properties:
        id:
          type: string
        active:
          type: boolean
        can_reset_sign_in:
          type: boolean
          description: "whether the caller may issue this user an invitation or remove their password: for a manager or
            administrator who has a way to sign in, only a super admin may; present on GET of one user"
        can_verify_email:
          type: boolean
          description: "whether the caller may mark this user's unverified addresses verified (mark-verified): never for yourself,
            and for a manager or administrator who has a way to sign in only a super admin may; present on GET of one
            user"
        email:
          type: string
        email_verified:
          type: boolean
