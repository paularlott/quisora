              type: string
            name:
              type: string
        mfa_enrolled_at:
          type: string
          description: when the authenticator app was last set up; null without one
          format: date-time
        name:
          type: string
          description: "read-only full name: given and family name"
        org_id:
          type: string
        passkeys:
          type: integer
          description: number of registered passkeys; present on GET of one user
        password_changed_at:
          type: string
          description: when the password was last set or removed; null if never
          format: date-time
        phone_number:
          type: string
          description: contact number in E.164 form (the phone_number claim); never used to sign in
        phone_number_verified:
          type: boolean
        role:
          type: string
          enum: [super_admin, admin, manager, user]
        status_changed:
          type: object
          description: the last time the account was disabled or enabled again (active says which); null if never
          properties:
            at:
              type: string
              format: date-time
            by:
              type: string
              description: a username, client:<name> or system
            by_id:
              type: string
            reason:
              type: string
        tags:
          type: array
          description: "identifiers (letters, digits and . _ : / -, 1-64 characters, starting and ending with a letter or digit; a
            colon separates a namespace, e.g. dept:finance); stored sorted; sent to applications in the tags claim
            together with the tags of the user's groups"
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._:/-]{0,62}[A-Za-z0-9])?$
        user_type:
