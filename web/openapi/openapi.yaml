        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/cluster/reload:
    parameters:
      - {$ref: "#/components/parameters/ApiVersion"}
    post:
      tags: [Cluster]
      summary: Reload every node's configuration
      description: "Every node in view re-reads its configuration file (super admin, after a recent re-authentication in the
        admin console): the master keys, the cluster keys (read again from Vault or 1Password when they name a secret
        store), and cluster.size and cluster.peers. Nodes sharing a database are reached through cluster.notify; without
        it only the node asked reloads (409, saying so). Every node checks first;
        only if all can apply and all name the same size does each one apply it (409 otherwise, with each node's report).
        The size changes by one node at a time: grow after adding the node to every configuration, shrink after stopping
        the node that leaves"
      operationId: post_cluster_reload
      security:
        - session: []
        - bearer: [admin]
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterReload"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Nothing, or not everything, was reloaded
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
