        settings: {$ref: "#/components/schemas/OrgSettings"}
        branding: {$ref: "#/components/schemas/Branding"}
        last_sign_out: {$ref: "#/components/schemas/SignOutEvent"}
        users:
          type: integer
          description: user count, super admins only
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    System:
      type: object
      properties:
        version:
          type: string
        organizations:
          type: integer
        users:
          type: integer
        sessions:
          type: integer
          description: browser sessions not yet removed (some may have expired)
        clustered:
          type: boolean
          description: nodes replicate over gossip (GET /api/cluster has their state)
        key_rotation_days:
          type: integer
          description: a new signing key every this many days; 0 = by hand only
        master_key_rotation:
          type: boolean
          description: previous master keys are configured (GET /api/master-key has where the rotation stands)
        last_sign_out: {$ref: "#/components/schemas/SignOutEvent"}
        secret_stores:
          type: array
          description: "secret stores configured ([secrets]): Vault, 1Password Connect, 1Password. Keys that name one
            (op://, vault://) are read again by POST /api/cluster/reload"
          items:
            type: string
    SignOutEvent:
      type: object
      description: an emergency sign-out (on an organization, the last one; absent when there has been none)
      properties:
        at:
          type: string
          format: date-time
        by:
          type: string
          description: username of who did it
        reason:
          type: string
        api_tokens:
          type: boolean
          description: personal API tokens ended too
    SignOutRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
          description: why; recorded in the audit log
        api_tokens:
          type: boolean
          description: end personal API tokens too (default false)
    OrgCreated:
      description: A new organization; service_account is its first service account, when the request asked for one
      allOf:
        - {$ref: "#/components/schemas/Org"}
        - type: object
          properties:
            service_account: {$ref: "#/components/schemas/ServiceAccountCreated"}
    OrgInput:
      type: object
      properties:
        display_name:
          type: string
        name:
          type: string
        settings: {$ref: "#/components/schemas/OrgSettings"}
        branding:
          description: "when creating an organization: its logo and primary colour, as for PATCH /api/orgs/{org}/branding (invalid branding is 422, field branding.primary_color and so on, and nothing is created); ignored when changing an organization, whose branding only people change"
          $ref: "#/components/schemas/BrandingInput"
        service_account:
          description: "when creating an organization: its first service account, with any of the service account scopes, import included; ignored when changing an organization"
          $ref: "#/components/schemas/ServiceAccountInput"
    OrgList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Org"}
        total:
          type: integer
    OrgSettings:
      type: object
      properties:
        api_token_groups:
          type: array
          description: ids of groups of the organization whose members may make api tokens; only, and at least one, when api_tokens is groups (at most 20)
          items:
            type: string
        api_tokens:
          type: string
          enum: [off, groups, everyone]
          description: who may make personal API tokens with the api scope, the ones the organization's applications check through introspection (an application must accept them too, with accepts_api_tokens); off (also when absent) is nobody. Checked at every use of a token, not only when it is made, so turning it off stops the tokens already made (they work again if it is turned back on). The scim, admin, backup and import scopes are not affected; their owner's role alone decides
        email_codes:
          type: boolean
          description: users without an authenticator app or passkey may give the second factor as a one-time code emailed to
            their verified address (never managers and above); needs the server to send email; off by default
        passkey_login:
          type: boolean
        password_login:
          type: boolean
        password_reset:
          type: boolean
          description: users may reset a forgotten password by email (with password_login); tenants can turn it off for their
            applications
        require_mfa:
          type: boolean
        session_idle:
          type: integer
          description: seconds; 0 = server default
        session_ttl:
          type: integer
          description: seconds; 0 = server default
    Provider:
      type: object
      properties:
        id:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        allowed_tenants:
          type: array
          items:
            type: string
        auto_provision:
          type: boolean
        callback_url:
          type: string
          description: this provider's redirect URI, to register with the provider
        client_id:
          type: string
        enabled:
          type: boolean
        has_secret:
          type: boolean
        issuer:
          type: string
        link_by_email:
          type: boolean
        name:
          type: string
        org_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        source_org:
          type: string
          description: "organization: the id of the organization whose users sign in"
        source_org_name:
          type: string
          description: "organization: that organization's display name"
        source_groups:
          type: array
          description: "organization: groups of that organization (ids) whose members alone sign in through the provider, at every sign-in; absent: all of its users"
          items:
            type: string
        tenant:
          type: string
        trust_mfa:
          type: boolean
        type:
          type: string
          enum: [oidc, google, microsoft, github, gitlab, auth0, organization]
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    ProviderInput:
      type: object
      properties:
        id:
          type: string
          description: "create only, optional: choose the id (and so the callback URL) before the provider is set up. An id is 22 base-62 digits (0-9 A-Z a-z, in that order): the 128-bit value of a UUIDv7, big-endian, left-padded with 0. A value above 2^128-1 (7n42DGM5Tflk9n8mt7Fhc7) is refused"
          pattern: ^[0-7][0-9A-Za-z]{21}$
          example: 034nmRmWuXazwvCcdrmRxu
        allowed_domains:
          type: array
          items:
            type: string
        allowed_tenants:
          type: array
          description: "microsoft with organizations: the tenant IDs whose users may sign in"
          items:
            type: string
        auto_provision:
          type: boolean
        client_id:
          type: string
          description: ignored for organization, whose client is made with the provider
        client_secret:
          type: string
          writeOnly: true
          description: ignored for organization, whose client is made with the provider
        enabled:
          type: boolean
        issuer:
          type: string
          description: "oidc: the https issuer; gitlab: the server address (empty: gitlab.com); auth0: the domain; ignored for
            google, github, microsoft and organization"
        link_by_email:
          type: boolean
          description: "on a first sign-in, link the one existing user whose verified email matches the provider's. Default
            on, except for organization, where it is off: the source organization's managers can mark any address
            verified, so turning it on trusts them with this organization's users"
        name:
          type: string
          description: button label; on create, empty means the type's name (Google, Microsoft…)
        scopes:
          type: array
          description: ignored for organization (openid, profile and email)
          items:
            type: string
        source_org:
          type: string
          description: "organization (super admins only, which also create, change and delete such a provider): the id or name
            of the other organization whose users sign in as guests. An application is made for the provider in that
            organization, and removed with it"
        source_groups:
          type: array
          description: "organization: up to 20 groups of that organization (ids) whose members alone may sign in through the
            provider, checked at every sign-in (a guest's first one and every later one); [] or absent: all of its users.
            Changing source_org needs groups of the new organization (or [])"
          items:
            type: string
        tenant:
          type: string
          description: "microsoft: a tenant ID, or organizations (then allowed_tenants is required)"
        trust_mfa:
          type: boolean
        type:
          type: string
          enum: [oidc, google, microsoft, github, gitlab, auth0, organization]
    ProviderList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Provider"}
        total:
          type: integer
    SSH:
      description: A tenant's SSH certificate authority settings (the names the PATCH takes), with its CA keys and endpoints
      allOf:
        - {$ref: "#/components/schemas/SSHSettings"}
        - type: object
          properties:
            keys:
              type: array
              description: the published CA keys, user keys first, oldest first
              items: {$ref: "#/components/schemas/SSHKey"}
            endpoints: {$ref: "#/components/schemas/SSHEndpoints"}
    SSHCertificate:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        tenant_id:
          type: string
        ca_key_id:
          type: string
          description: the CA key that signed it
        fingerprint:
          type: string
          description: "SHA256:... of the certified public key"
        host:
          type: boolean
          description: a host certificate (otherwise a user certificate)
        issued_by:
          type: string
          description: host certificates, the actor that asked for it
        key_id:
          type: string
          description: the certificate's key id, as sshd logs it
        principals:
          type: array
          description: "user certificates: the user's username, group:<name> for each of the user's groups and role:<role> for each application role, as the tenant's settings choose; host certificates: host names"
          items:
            type: string
        extensions:
          type: array
          description: user certificates, the OpenSSH extensions it grants
          items:
            type: string
        source_addresses:
          type: array
          description: user certificates, the addresses it works from (the critical option source-address); absent, anywhere
          items:
            type: string
        reason:
          type: string
          description: "when revoked, why: revoked (by hand), ca_key_removed, user_deleted, user_disabled, sessions_ended, signed_out, role_not_allowed, app_unavailable (the tenant's SSH application is disabled or missing), access_removed, principals_changed, ssh_off (SSH is turned off for the tenant) or settings_changed (it grants more than the tenant's settings now would: a longer lifetime, an extension no longer permitted, other source addresses). A certificate found revoked for access_removed, principals_changed or role_not_allowed stays revoked when the user gets the access back (revoked is then true, revoked_by system)"
          enum: [revoked, ca_key_removed, user_deleted, user_disabled, sessions_ended, signed_out, role_not_allowed, app_unavailable, access_removed, principals_changed, ssh_off, settings_changed]
        revoked:
          type: boolean
          description: "revoked for good: by hand (revoked_by the actor), or written down by Quisora when it found the certificate's user had lost access, a role or a principal (revoked_by system, with that reason)"
        revoked_at:
          type: string
          format: date-time
        revoked_by:
          type: string
        serial:
          type: string
          description: the certificate's serial number, a decimal string
        status:
          type: string
          enum: [active, expired, revoked]
        user_id:
          type: string
          description: user certificates
        username:
          type: string
          description: user certificates, the user's username now
        valid_after:
          type: string
          format: date-time
        valid_before:
          type: string
          format: date-time
        via:
          type: string
          description: "how it was asked for: cli (the sign endpoint), account (the account page) or api (a host certificate)"
          enum: [cli, account, api]
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    SSHCertificateList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SSHCertificate"}
        total:
          type: integer
    SSHEndpoints:
      type: object
      description: where servers and people reach the tenant's SSH authority
      properties:
        ca_pub:
          type: string
          description: the user CA public keys, one authorized_keys line each (TrustedUserCAKeys)
        discovery:
          type: string
          description: the discovery document that `quisora ssh login` and `quisora ssh fetch` start from
        host_sign:
          type: string
          description: where host certificates are signed (the host-certificates operation)
        known_hosts:
          type: string
          description: "@cert-authority lines for the host CA keys"
        krl:
          type: string
          description: the key revocation list (RevokedKeys)
    SSHHostCertificate:
      type: object
      properties:
        certificate:
          type: string
          description: "the certificate, authorized_keys form (ssh-ed25519-cert-v01@openssh.com AAAA...): a server's HostCertificate"
        key_id:
          type: string
        principals:
          type: array
          items:
            type: string
        serial:
          type: string
          description: a decimal string
        valid_after:
          type: string
          format: date-time
        valid_before:
          type: string
          format: date-time
    SSHHostCertificateInput:
      type: object
      required: [public_key, principals]
      properties:
        principals:
          type: array
          description: the host names (no wildcards) the certificate is for, 1 to 32, each matching one of the tenant's host_patterns
          items:
            type: string
        public_key:
          type: string
          description: the server's public key, an authorized_keys line (ssh_host_ed25519_key.pub)
        ttl_days:
          type: integer
          description: how long it lasts, 1 to the tenant's host_ttl_days (the default)
    SSHInput:
      type: object
      description: The settings to change; omitted ones keep their values
      properties:
        allow_privileged:
          type: boolean
          description: managers and administrators may get user certificates (also lets them use the device flow of the SSH application)
        cert_ttl:
          type: integer
          description: user certificate lifetime in seconds, 300 to 86400 (default 28800)
        enabled:
          type: boolean
          description: true the first time makes the CA key and the SSH application; false revokes every certificate of the tenant until it is true again
        host_certs:
          type: boolean
          description: host certificates may be signed (needs host_patterns)
        host_patterns:
          type: array
          description: patterns host names must match, such as *.example.com; required when host_certs is on, at most 32
          items:
            type: string
        host_ttl_days:
          type: integer
          description: host certificate lifetime in days, 1 to 365 (default 90)
        max_auth_age:
          type: integer
          description: how old, in seconds, the sign-in may be when it asks for a certificate, 60 to 86400 (default 3600)
        permit_agent_forwarding:
          type: boolean
        permit_port_forwarding:
          type: boolean
        permit_pty:
          type: boolean
        permit_user_rc:
          type: boolean
        permit_x11_forwarding:
          type: boolean
        principal_groups:
          type: boolean
          description: "put group:<name> for each of the user's groups in the certificate (group:ops)"
        principal_roles:
          type: boolean
          description: "put role:<role> for each application role the tenant's access list gives the user in the certificate (role:deploy)"
        principal_username:
          type: boolean
          description: put the user's username in the certificate
        rotation_days:
          type: integer
          description: rotate the user CA key every this many days, 8 to 3650; 0 rotates by hand only
        source_addresses:
          type: array
          description: addresses or CIDRs the certificates work from (the source-address critical option); none means anywhere, at most 32
          items:
            type: string
    SSHKey:
      type: object
      properties:
        id:
          type: string
        alg:
          type: string
          enum: [ssh-ed25519]
        expires:
          type: string
          format: date-time
          description: "when it leaves the published list (absent: kept until removed)"
        fingerprint:
          type: string
          description: "SHA256:..."
        not_before:
          type: string
          format: date-time
          description: when it starts signing
        public_key:
          type: string
          description: authorized_keys form
        purpose:
          type: string
          enum: [user, host]
        retire_at:
          type: string
          format: date-time
          description: "when it stops signing (absent: until a successor starts)"
        state:
          type: string
          description: "next (published, not signing yet), active (signs now) or retired (no longer signs; may be removed)"
          enum: [next, active, retired]
    SSHRotateInput:
      type: object
      required: [purpose]
      properties:
        immediate:
          type: boolean
          description: the successor signs at once and the old key retires now
        purpose:
          type: string
          enum: [user, host]
    SSHSettings:
      type: object
      properties:
        allow_privileged:
          type: boolean
        cert_ttl:
          type: integer
        client_id:
          type: string
          description: the tenant's SSH application (made when SSH is first enabled)
        enabled:
          type: boolean
        host_certs:
          type: boolean
        host_patterns:
          type: array
          items:
            type: string
        host_ttl_days:
          type: integer
        max_auth_age:
          type: integer
        permit_agent_forwarding:
          type: boolean
        permit_port_forwarding:
          type: boolean
        permit_pty:
          type: boolean
        permit_user_rc:
          type: boolean
        permit_x11_forwarding:
          type: boolean
        principal_groups:
          type: boolean
        principal_roles:
          type: boolean
        principal_username:
          type: boolean
        rotation_days:
          type: integer
        source_addresses:
          type: array
          items:
            type: string
    ScimDiscovery:
      type: object
      description: ServiceProviderConfig, or a ListResponse of ResourceTypes or Schemas (RFC 7644 §4).
      additionalProperties: true
    ScimError:
      type: object
      required: [schemas, status]
      properties:
        detail:
          type: string
        schemas:
          type: array
          items:
            type: string
        scimType:
          type: string
        status:
          type: string
    ScimGroup:
      type: object
      description: "A SCIM Group (RFC 7643 §4.2). Every attribute: the server's Schemas endpoint,
        urn:ietf:params:scim:schemas:core:2.0:Group."
      properties:
        id:
          type: string
        displayName:
          type: string
        externalId:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              display:
                type: string
              value:
                type: string
        meta:
          type: object
        schemas:
          type: array
          items:
            type: string
      additionalProperties: true
    ScimListResponse:
      type: object
      required: [schemas, totalResults, Resources]
      properties:
        Resources:
          type: array
          items:
            type: object
        itemsPerPage:
          type: integer
        schemas:
          type: array
          items:
            type: string
        startIndex:
          type: integer
        totalResults:
          type: integer
    ScimOrganization:
      type: object
      description: "A Quisora organization as a SCIM resource (super admins). Every attribute: the server's Schemas endpoint,
        urn:paularlott:quisora:scim:schemas:2.0:Organization."
      properties:
        id:
          type: string
        displayName:
          type: string
        meta:
          type: object
        name:
          type: string
        schemas:
          type: array
          items:
            type: string
      additionalProperties: true
    ScimPatchOp:
      type: object
      required: [schemas, Operations]
      properties:
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
