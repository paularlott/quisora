    UserCreate:
      type: object
      required: [email, given_name]
      properties:
        active:
          type: boolean
        email:
          type: string
          description: required on create, unique in the organization; the sign-in name (email address + password)
        email_verified:
          type: boolean
          description: "true marks the primary address verified without the mailed link: never for yourself, and for a manager or
            administrator who has a way to sign in only by a super admin"
        external_id:
          type: string
          description: "the user's identifier in a provisioning system (SCIM externalId), unique in the organization, at most
            255 characters; set or changed by administrators only (a manager may send the value the user already has)"
        family_name:
          type: string
          description: last name; optional
        given_name:
          type: string
          description: first name; required on create and never empty
        password_hash:
          type: string
          description: "a password hash brought from another system, for a migration: bcrypt ($2a$, $2b$ or $2y$, cost 4 to
            14), SHA-512 crypt ($6$, at most 1,000,000 rounds) or argon2id. Super admins only (an API token needs the import scope too); never with password, never on an
            update. It is stored sealed like any password, and the user's first sign-in re-hashes it with argon2id. Audited
            on user.create as password: imported bcrypt (sha512-crypt, argon2id)."
        totp_secret:
          type: string
          writeOnly: true
          description: "the authenticator-app secret the user already has in another system, for a migration, so their app keeps
            working: base32 (either case, spaces and = padding are ignored) of 16 to 128 characters (80 to 640 bits; SHA-1,
            6 digits, 30 seconds, one step either way, as authenticator apps use by default). Super admins only (an API
            token needs the import scope too); never on an update. It is stored sealed, the user is enrolled as if they had
            set the app up, and the secret is never returned, logged or audited (mfa.import is recorded without it). The
            user is not given recovery codes: the account page asks them to make some. 422 on the field when it is not
            base32 or the wrong length; the value is never repeated in the error."
        identities:
          type: array
          writeOnly: true
          description: "sign-in providers of this organization to link the new user to, so their first sign-in through each
            finds this account (a migration of users who sign in through an organization's provider). Super admins only (an
            API token needs the import scope too); never on an update. The user and their links are created together; the
            links are marked as made by an administrator (an administrator's link is dropped, as every non-connected link
            is, if the user is promoted to manager or above). At most 10, one per provider. 422 on identities for an
            unknown provider (or one of another organization) or a bad subject, 409 when the subject is already linked
            to another user at that provider."
          maxItems: 10
          items:
            type: object
            required: [provider, subject]
            properties:
              provider:
                type: string
                description: the provider's id, or its name in this organization
              subject:
                type: string
                description: what the provider asserts for the person (its sub claim, a GitHub user id), 1 to 255 characters, kept exactly as given
                minLength: 1
                maxLength: 255
        invite:
          type: object
          description: issue an invitation link and return it in the response
          properties:
            email:
              type: boolean
              description: also email it (needs an email address)
        locale:
          type: string
          description: BCP 47 language tag (en_GB accepted); "" clears
        phone_number:
          type: string
          description: international form (+ and the country code; spaces, dots, dashes and brackets are dropped); "" clears; a
            new number is unverified unless phone_number_verified is sent
        phone_number_verified:
          type: boolean
        role:
          type: string
        status_reason:
          type: string
          description: recorded when this change sets active to a new value (at most 500 characters)
        tags:
          type: array
          description: "identifiers (letters, digits and . _ : / -, 1-64 characters, starting and ending with a letter or digit; a
            colon separates a namespace, e.g. dept:finance); stored sorted; sent to applications in the tags claim
            together with the tags of the user's groups"
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._:/-]{0,62}[A-Za-z0-9])?$
        user_type:
          type: string
        username:
          type: string
          description: optional; shown to applications as preferred_username, defaults to the email; never used to sign in
        valid_until:
          type: string
          description: RFC 3339 time or a date (YYYY-MM-DD, ends at the start of that day UTC); "" = no end
        work:
          $ref: "#/components/schemas/Work"
          description: fields left out are unchanged; "" clears one
        zoneinfo:
          type: string
          description: IANA time zone; "" clears
