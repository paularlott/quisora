  /api/orgs/{org}/tenants/{id}/ssh:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - name: id
        in: path
        required: true
        description: tenant id or name
        schema:
          type: string
      - {$ref: "#/components/parameters/ApiVersion"}
    get:
      tags: [SSH certificates]
      summary: Get the tenant's SSH settings and CA keys
      description: The tenant's SSH certificate authority settings (the defaults while SSH has never been enabled), its CA keys, and the addresses servers and people use (the discovery URL that `quisora ssh login` and `quisora ssh fetch` start from, the CA key lists, the revocation list, and where host certificates are signed). Organization administrators, and service accounts with the ssh scope.
      operationId: get_orgs_org_tenants_id_ssh
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [ssh]
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SSH"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
    patch:
      tags: [SSH certificates]
      summary: Change the tenant's SSH settings
      description: "Change the settings named in the body; the others keep their values. Enabling SSH for the first time makes the tenant's user CA key (and the host CA key when host certificates are on) and its SSH application (a public first-party client named SSH, which the console links to); enabling again makes nothing twice. Field errors are named ssh.cert_ttl and so on. While SSH is on at least one of principal_username, principal_groups and principal_roles must be on (422, field ssh.principal_username), and the lists (source_addresses, host_patterns) hold at most 32 entries. Turning SSH off keeps the keys and revokes every certificate of the tenant: signing and the discovery of `quisora ssh login` are refused, while the CA keys and the revocation list stay published, and the list then revokes every CA key of the tenant, so servers drop its certificates when they next fetch it. Turning SSH on again makes the certificates that were not revoked otherwise valid again. A tenant (or an organization with a tenant) with SSH on cannot be deleted."
      operationId: patch_orgs_org_tenants_id_ssh
      security:
        - session: []
        - bearer: [admin]
        - serviceAccount: [ssh]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SSHInput"}
        required: true
      responses:
        "200":
          description: Success
          headers:
            Api-Version: {$ref: "#/components/headers/ApiVersion"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SSH"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/orgs/{org}/tenants/{id}/ssh/rotate:
    parameters:
      - {$ref: "#/components/parameters/Org"}
      - name: id
        in: path
        required: true
        description: tenant id or name
        schema:
          type: string
      - {$ref: "#/components/parameters/ApiVersion"}
    post:
      tags: [SSH certificates]
      summary: Rotate a CA key
      description: "Make the tenant's user or host CA key a successor. A user key's successor is published at once and signs seven days later, so servers that fetch the CA key list daily have it first; a host key's signs at once and the old one stays published until removed. immediate: the successor signs at once and the old key retires now (a user key stays published one more day, for the certificates it signed); use it, then remove the old key, when a key may have been exposed. 422 (field immediate) while a scheduled rotation is under way."
      operationId: post_orgs_org_tenants_id_ssh_rotate
      security:
        - session: []
