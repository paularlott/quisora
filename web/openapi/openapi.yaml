          type: string
        external_id:
          type: string
        members:
          type: integer
          description: number of users in the group
        org_id:
          type: string
        tags:
          type: array
          description: "identifiers (letters, digits and . _ : / -, 1-64 characters, starting and ending with a letter or digit; a
            colon separates a namespace, e.g. dept:finance); stored sorted; sent to applications in the tags claim
            together with the tags of the user's groups"
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._:/-]{0,62}[A-Za-z0-9])?$
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
