    ClusterReload:
      type: object
      required: [nodes]
      properties:
        reloaded:
          type: boolean
        error:
          type: string
          description: Why nothing, or not everything, was reloaded
        nodes:
          type: array
          items: {$ref: "#/components/schemas/ClusterReloadNode"}
    ClusterReloadNode:
      type: object
      required: [node, size]
      properties:
        node:
          type: string
        size:
          type: integer
          description: The cluster.size the node's configuration names
        changes:
          type: array
          items: {type: string}
          description: What applying changed, and settings left alone because they were given on the command line
        error:
          type: string
    Cluster:
      type: object
      properties:
        alive:
          type: integer
        catching_up:
          type: boolean
          description: not ready yet because the node is catching up with (or copying everything from) the other nodes
        resyncing:
          type: boolean
          description: the node's data was lost, replaced or restored and it is copying everything from the other nodes
        partitions_owned:
          type: integer
          description: how many of the 64 partitions this node owns (gossip clusters)
        partitions:
          type: array
          description: every partition as this node sees it (gossip clusters)
          items:
            type: object
            properties:
              partition: {type: integer}
              owner: {type: string, description: the node this one last heard take the partition}
              epoch: {type: integer, description: the owner's epoch counter}
              committed: {type: integer, description: the sequence number of the last write this node applied}
              promised: {type: integer, description: the highest epoch counter this node has promised}
              owned: {type: boolean}
        writes: {type: integer, description: changes this node made that were committed on a majority}
        writes_unavailable: {type: integer}
        reads: {type: integer, description: fresh reads this node asked an owner for}
        reads_failed: {type: integer}
        takeovers: {type: integer, description: partitions this node became the owner of}
        clock_skewed:
          type: integer
          description: records received with a version more than 5 seconds ahead of this node's clock
        clock_offset_ms:
          type: integer
          description: how far the other nodes' clocks are ahead of this one's (the median of their latest readings, in milliseconds; negative - behind); absent until a peer has answered
        cluster_keys:
          type: array
          description: the ids of this node's gossip keys, the one that encrypts first (a rotation shows more than one); never the keys
          items:
            type: string
        forced_start:
          type: string
        leader:
          type: boolean
        members:
          type: integer
        node_id:
          type: string
        nodes:
          type: array
          description: every member, as this node sees it (replicated clusters only)
          items:
            type: object
            properties:
              id:
                type: string
              address:
                type: string
              leader:
                type: boolean
              ready:
                type: boolean
              self:
                type: boolean
              state:
                type: string
                enum: [alive, suspect, dead, leaving]
              version:
                type: string
              data_set:
                type: string
                description: the data set the member holds, as it publishes it (nodes of different data sets ignore each other)
        data_set:
          type: string
          description: the data set this node holds (gossip clusters; absent while it holds none and waits for one)
        quorum:
          type: integer
        ready:
          type: boolean
        refused:
          type: integer
          description: changes an owner refused (a version had moved, a unique value was in use)
        replicating:
          type: boolean
        size:
          type: integer
        skew_refused:
          type: integer
        standalone:
          type: boolean
        unconfirmed:
          type: integer
          description: writes whose outcome this node does not know (the owner was lost mid-write)
        writable:
          type: boolean
    ConnectedApp:
      type: object
      properties:
        client_id:
          type: string
        grants:
          type: integer
          description: live refresh grants (one per signed-in session)
        last_used:
          type: string
          format: date-time
        name:
          type: string
        remembered:
          type: boolean
          description: the user's consent is remembered, so the application signs them in without asking again until their access is removed
        scopes:
          type: array
          items:
            type: string
        since:
          type: string
          format: date-time
